name: CI Pipeline

on:
  push:
    branches: ["development", "main"]
  pull_request:
    branches: ["development", "main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "gradle"

      - name: Make gradlew executable
        run: chmod +x server/gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Verify code compilation
        working-directory: ./server
        run: ./gradlew classes testClasses --no-daemon

      - name: Run Tests
        working-directory: ./server
        run: ./gradlew test --no-daemon --continue

      - name: Build Artifact
        working-directory: ./server
        run: ./gradlew build -x test --no-daemon

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: application-artifact
          path: server/build/libs/*.jar
          retention-days: 7

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: server/build/reports/tests/test/
          retention-days: 7

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: application-artifact
          path: release-artifacts/

      - name: Generate Release Tag
        id: tag
        run: |
          TAG="v$(date +'%Y.%m.%d')-build.${{ github.run_number }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Generated tag: $TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Release ${{ steps.tag.outputs.tag }}"
          body: |
            ##  MecaFix Release ${{ steps.tag.outputs.tag }}

            **Commit:** `${{ github.sha }}`
            **Branch:** `main`
            **Build:** #${{ github.run_number }}

            ### Changes
            ${{ github.event.head_commit.message }}
          files: release-artifacts/*.jar
          generate_release_notes: true
          draft: false
          prerelease: false