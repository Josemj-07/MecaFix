services:
  postgres:
    image: postgres:17-alpine
    container_name: mecafix-db
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: mecafix
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - mecafix-data:/var/lib/postgresql/data
      - ../db/initdb.sql:/docker-entrypoint-initdb.d/initdb.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d mecafix" ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: mecafix-backend
    restart: on-failure
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mecafix
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}

  frontend:
    build: ../frontend
    container_name: mecafix-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mecafix-data:
